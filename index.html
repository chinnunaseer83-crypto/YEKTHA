<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yektha Shop</title>
  <style>
    :root {
      --primary: #1a1a1a;
      --bg: #f2f2f2;
      --white: #ffffff;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      background: var(--bg);
      color: #333;
    }

    /* Sticky Header */
    header {
      background: #000;
      color: white;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      font-size: 0.9rem;
      outline: none;
    }

    /* Categories Horizontal Scroller */
    .cat-container {
      background: #fff;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 10px;
      padding-left: 15px;
    }
    .cat-container::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 7px 18px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    /* Product Grid */
    .container {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 10px;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 768px) {
      main { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

    /* Product Card */
    .card {
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #eee;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
    }

    .info {
      padding: 8px 8px 12px 8px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .info h4 {
      margin: 0;
      font-size: 0.85rem;
      color: #333;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: auto;
    }

    .price {
      font-weight: 800;
      font-size: 1rem;
      color: #000;
      display: block;
      margin-top: -2px;
      margin: 2px 0 0 0;
    }

    .rating {
      color: #f1c40f;
      font-size: 0.65rem;
      margin: 2px 0 6px 0;
    }

    .buy-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: auto;
    }

    /* Modal Style */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #fff;
      margin: 5% auto;
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      position: relative;
      overflow-y: auto;
      max-height: 90vh;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close-modal {
      position: absolute;
      right: 15px; top: 10px;
      font-size: 28px;
      color: #000;
      font-weight: bold;
      z-index: 10;
    }

    .modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
    .modal-info { padding: 15px; text-align: left; }
    .modal-info h2 { font-size: 1.2rem; margin: 0 0 5px 0; }
    .modal-info .price { font-size: 1.4rem; margin-bottom: 2px; }
    .modal-info .rating { margin-bottom: 10px; font-size: 0.8rem; }
    
    .modal-buy-btn {
      background: #000;
      color: #fff;
      border: none;
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Yektha</h1>
  <input type="text" id="search" placeholder="Search products..." class="search-bar">
</header>

<div class="cat-container" id="categories"></div>

<div class="container">
  <main id="products-grid">
    <div id="loading" style="grid-column: 1/-1; text-align: center; padding: 50px;">Loading products...</div>
  </main>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img id="modalImg" class="modal-img" src="">
    <div class="modal-info">
      <h2 id="modalName"></h2>
      <span id="modalPrice" class="price"></span>
      <div id="modalRating" class="rating"></div>
      <p id="modalCat" style="color: #777; font-size: 0.75rem; margin-bottom: 15px;"></p>
      <button id="modalBuyBtn" class="modal-buy-btn">ORDER ON WHATSAPP</button>
    </div>
  </div>
</div>

<script>
  const SHEET_ID = '1HyGFrTu37DJ4u9mxx2vK0aBC5B_yqViRGESUEkV34aU'; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let allProducts = [];

  async function fetchProducts() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1];
      const data = JSON.parse(jsonText);
      const rows = data.table.rows;

      allProducts = rows.map(row => ({
        name: row.c[0] ? row.c[0].v : 'Unnamed Product',
        price: row.c[1] ? row.c[1].v : '0',
        rating: row.c[2] ? row.c[2].v : '⭐⭐⭐⭐',
        category: row.c[3] ? row.c[3].v : 'General',
        photo: row.c[4] ? row.c[4].v : 'https://via.placeholder.com/250'
      }));

      setupCategories();
      displayProducts(allProducts);
    } catch (error) {
      document.getElementById('products-grid').innerHTML = "<p>Error loading items.</p>";
    }
  }

  function displayProducts(products) {
    const grid = document.getElementById('products-grid');
    grid.innerHTML = products.map(p => `
      <div class="card" onclick="openModal('${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.rating}', '${p.photo}', '${p.category}')">
        <img src="${p.photo}" loading="lazy">
        <div class="info">
          <h4>${p.name}</h4>
          <span class="price">₹${p.price}</span>
          <div class="rating">${p.rating}</div>
        </div>
        <button class="buy-btn">ORDER</button>
      </div>
    `).join('');
  }

  function setupCategories() {
    const categoriesDiv = document.getElementById('categories');
    const uniqueCats = ['All', ...new Set(allProducts.map(p => p.category))];
    categoriesDiv.innerHTML = uniqueCats.map(c => `
      <button class="cat-btn ${c==='All'?'active':''}" onclick="filter('${c}', this)">${c}</button>
    `).join('');
  }

  function filter(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'All' ? allProducts : allProducts.filter(p => p.category === cat);
    displayProducts(filtered);
  }

  function openModal(name, price, rating, photo, cat) {
    document.getElementById('modalName').innerText = name;
    document.getElementById('modalPrice').innerText = '₹' + price;
    document.getElementById('modalRating').innerText = rating;
    document.getElementById('modalImg').src = photo;
    document.getElementById('modalCat').innerText = 'Category: ' + cat;
    document.getElementById('modalBuyBtn').onclick = (e) => { e.stopPropagation(); order(name); };
    document.getElementById('productModal').style.display = "block";
  }

  function closeModal() {
    document.getElementById('productModal').style.display = "none";
  }

  window.onclick = function(event) {
    if (event.target == document.getElementById('productModal')) closeModal();
  }

  function order(name) {
    const wpNumber = "7594069256";
    const message = encodeURIComponent(`Hello Yektha! I am interested in: ${name}.`);
    window.open(`https://wa.me/${wpNumber}?text=${message}`, "_blank");
  }

  document.getElementById('search').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    displayProducts(allProducts.filter(p => p.name.toLowerCase().includes(val)));
  };

  fetchProducts();
</script>

</body>
</html>
