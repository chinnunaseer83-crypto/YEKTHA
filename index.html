<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yektha Shop</title>
  <style>
    :root {
      --primary: #1a1a1a;
      --accent: #e67e22;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: var(--bg);
      color: #333;
    }

    header {
      background: #000;
      color: white;
      padding: 20px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 1.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }

    /* Professional Category Scroller */
    .cat-container {
      background: #fff;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 115px; /* Adjust based on header height */
      z-index: 999;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      padding-left: 15px;
    }

    .cat-container::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 20px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .cat-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 10px;
    }

    /* 2-Column Grid for Mobile */
    main {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      main { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
      .cat-container { justify-content: center; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      border: 1px solid #f0f0f0;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      background: #f9f9f9;
    }

    .info {
      padding: 10px;
      flex-grow: 1;
      text-align: left;
    }

    .info h4 {
      margin: 0 0 2px 0;
      font-size: 0.9rem;
      color: #222;
      height: 1.2em; /* Limits to 2 lines */
      overflow: hidden;
    }

    .price {
      font-weight: 700;
      font-size: 1rem;
      color: #000;
      display: block;
      margin-top: 0;
      margin-bottom: 4px;
    }

    .rating {
      color: #f1c40f;
      font-size: 0.7rem;
      margin-bottom: 8px;
    }

    .buy-btn {
      background: #000;
      color: white;
      border: none;
      padding: 10px 5px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    #loading { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>

<header>
  <h1>Yektha</h1>
  <input type="text" id="search" placeholder="Search products..." class="search-bar">
</header>

<div class="cat-container" id="categories">
  </div>

<div class="container">
  <main id="products-grid">
    <div id="loading">Loading products...</div>
  </main>
</div>

<script>
  const SHEET_ID = '1HyGFrTu37DJ4u9mxx2vK0aBC5B_yqViRGESUEkV34aU'; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let allProducts = [];

  async function fetchProducts() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1];
      const data = JSON.parse(jsonText);
      const rows = data.table.rows;

      allProducts = rows.map(row => ({
        name: row.c[0] ? row.c[0].v : 'Unnamed Product',
        price: row.c[1] ? row.c[1].v : '0',
        rating: row.c[2] ? row.c[2].v : '⭐⭐⭐⭐',
        category: row.c[3] ? row.c[3].v : 'General',
        photo: row.c[4] ? row.c[4].v : 'https://via.placeholder.com/250'
      }));

      setupCategories();
      displayProducts(allProducts);
    } catch (error) {
      document.getElementById('products-grid').innerHTML = `<p style="grid-column:1/-1; text-align:center;">Error loading shop!</p>`;
    }
  }

  function displayProducts(products) {
    const grid = document.getElementById('products-grid');
    grid.innerHTML = products.length ? products.map(p => `
      <div class="card">
        <img src="${p.photo}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/250?text=No+Image'">
        <div class="info">
          <h4>${p.name}</h4>
          <span class="price">₹${p.price}</span>
          <div class="rating">${p.rating}</div>
        </div>
        <button class="buy-btn" onclick="order('${p.name}')">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.973L0 16l5.053-1.326A7.817 7.817 0 0 0 7.998 16c4.369 0 7.926-3.559 7.93-7.93a7.856 7.856 0 0 0-2.327-5.744z"/>
          </svg>
          ORDER
        </button>
      </div>
    `).join('') : "<p style='grid-column:1/-1; text-align:center;'>No items found.</p>";
  }

  function setupCategories() {
    const categoriesDiv = document.getElementById('categories');
    const uniqueCats = ['All', ...new Set(allProducts.map(p => p.category))];
    
    categoriesDiv.innerHTML = uniqueCats.map(c => `
      <button class="cat-btn ${c==='All'?'active':''}" onclick="filter('${c}', this)">${c}</button>
    `).join('');
  }

  function filter(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'All' ? allProducts : allProducts.filter(p => p.category === cat);
    displayProducts(filtered);
  }

  function order(name) {
    const wpNumber = "7594069256";
    const message = encodeURIComponent(`Hello Yektha! I want to buy: ${name}.`);
    window.open(`https://wa.me/${wpNumber}?text=${message}`, "_blank");
  }

  document.getElementById('search').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    displayProducts(allProducts.filter(p => p.name.toLowerCase().includes(val)));
  };

  fetchProducts();
</script>

</body>
</html>
