<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yektha Shop</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --accent: #000000;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Modern Premium Header */
    header {
      background: #000;
      color: #fff;
      padding: 25px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 1.7rem;
      letter-spacing: 6px; /* അക്ഷരങ്ങൾക്കിടയിൽ ഗ്യാപ്പ് നൽകി */
      text-transform: uppercase;
      font-weight: 300;
    }

    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: 0.3s;
    }

    .search-bar:focus {
      background: #222;
      border-color: #555;
    }

    /* Category Swipe Bar */
    .cat-container {
      background: #fff;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-left: 15px;
      scrollbar-width: none;
    }
    .cat-container::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 22px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    /* Product Grid Alignment */
    .container {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 12px; /* Side spacing for mobile */
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      main { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    }

    /* Product Card */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #eee;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: 0.3s;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1.1;
      object-fit: cover;
      background: #f9f9f9;
    }

    .info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .info h4 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.2;
      color: #444;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.4em; /* Alignment fix */
    }

    .price {
      font-weight: 800;
      font-size: 1rem;
      color: #000;
      margin: 2px 0; /* Minimized gap */
    }

    .rating {
      color: #f1c40f;
      font-size: 0.65rem;
      margin-bottom: 8px;
    }

    /* Black Button Theme */
    .buy-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
      margin-top: auto;
      cursor: pointer;
    }

    /* Modal / Popup Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close-modal {
      position: absolute;
      right: 15px; top: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #000;
      background: rgba(255,255,255,0.8);
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-img { width: 100%; aspect-ratio: 1/1.2; object-fit: cover; }
    .modal-info { padding: 20px; }
    .modal-info h2 { font-size: 1.3rem; margin: 0 0 5px 0; }
    
    .modal-buy-btn {
      background: #000;
      color: #fff;
      border: none;
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      margin-top: 15px;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <h1>Yektha</h1>
  <input type="text" id="search" placeholder="Search products..." class="search-bar">
</header>

<div class="cat-container" id="categories"></div>

<div class="container">
  <main id="products-grid">
    <div id="loading" style="grid-column: 1/-1; text-align: center; padding: 50px; color: #888;">Loading your shop...</div>
  </main>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="">
    <div class="modal-info">
      <h2 id="modalName"></h2>
      <span id="modalPrice" class="price" style="font-size: 1.5rem;"></span>
      <div id="modalRating" class="rating" style="font-size: 0.9rem;"></div>
      <p id="modalCat" style="color: #666; font-size: 0.8rem; margin: 0;"></p>
      <button id="modalBuyBtn" class="modal-buy-btn">ORDER ON WHATSAPP</button>
    </div>
  </div>
</div>

<script>
  const SHEET_ID = '1HyGFrTu37DJ4u9mxx2vK0aBC5B_yqViRGESUEkV34aU'; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let allProducts = [];

  async function fetchProducts() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1];
      const data = JSON.parse(jsonText);
      const rows = data.table.rows;

      allProducts = rows.map(row => ({
        name: row.c[0] ? row.c[0].v : 'Product',
        price: row.c[1] ? row.c[1].v : '0',
        rating: row.c[2] ? row.c[2].v : '⭐⭐⭐⭐',
        category: row.c[3] ? row.c[3].v : 'General',
        photo: row.c[4] ? row.c[4].v : 'https://via.placeholder.com/300'
      }));

      setupCategories();
      displayProducts(allProducts);
    } catch (e) {
      document.getElementById('products-grid').innerHTML = "Error loading products. Check Sheet settings.";
    }
  }

  function displayProducts(products) {
    const grid = document.getElementById('products-grid');
    grid.innerHTML = products.map(p => `
      <div class="card" onclick="openModal('${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.rating}', '${p.photo}', '${p.category}')">
        <img src="${p.photo}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
        <div class="info">
          <h4>${p.name}</h4>
          <span class="price">₹${p.price}</span>
          <div class="rating">${p.rating}</div>
        </div>
        <button class="buy-btn">ORDER</button>
      </div>
    `).join('');
  }

  function setupCategories() {
    const categoriesDiv = document.getElementById('categories');
    const uniqueCats = ['All', ...new Set(allProducts.map(p => p.category))];
    categoriesDiv.innerHTML = uniqueCats.map(c => `
      <button class="cat-btn ${c==='All'?'active':''}" onclick="filter('${c}', this)">${c}</button>
    `).join('');
  }

  function filter(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'All' ? allProducts : allProducts.filter(p => p.category === cat);
    displayProducts(filtered);
  }

  function openModal(name, price, rating, photo, cat) {
    document.getElementById('modalName').innerText = name;
    document.getElementById('modalPrice').innerText = '₹' + price;
    document.getElementById('modalRating').innerText = rating;
    document.getElementById('modalImg').src = photo;
    document.getElementById('modalCat').innerText = 'Category: ' + cat;
    document.getElementById('modalBuyBtn').onclick = () => order(name);
    document.getElementById('productModal').style.display = "flex";
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('productModal').style.display = "none";
    document.body.style.overflow = 'auto';
  }

  window.onclick = e => { if (e.target.id === 'productModal') closeModal(); }

  function order(name) {
    const wpNumber = "7594069256";
    const msg = encodeURIComponent(`Hello Yektha! I'm interested in: ${name}.`);
    window.open(`https://wa.me/${wpNumber}?text=${msg}`, "_blank");
  }

  document.getElementById('search').oninput = e => {
    const val = e.target.value.toLowerCase();
    displayProducts(allProducts.filter(p => p.name.toLowerCase().includes(val)));
  };

  fetchProducts();
</script>

</body>
</html>
