<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yektha Shop</title>
  <style>
    :root { --primary: #000; --bg: #f4f7f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: #333; }
    
    header { background: #000; color: white; padding: 40px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; }
    .search-bar { width: 90%; max-width: 500px; padding: 15px; border-radius: 30px; border: none; margin-top: 20px; outline: none; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

    .container { display: flex; max-width: 1200px; margin: 30px auto; padding: 10px; gap: 30px; min-height: 60vh; }
    
    /* Sidebar styling */
    aside { width: 220px; }
    aside h3 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 5px; }
    
    /* Categories Layout */
    #categories { display: flex; flex-direction: column; gap: 10px; }
    .cat-btn { width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; border-radius: 8px; font-weight: 500; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .cat-btn:hover { background: #000; color: white; transform: translateX(5px); }

    /* Product Grid */
    main { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
    .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transition: transform 0.3s; display: flex; flex-direction: column; border: 1px solid #eee; }
    .card:hover { transform: translateY(-10px); }
    .card img { width: 100%; height: 250px; object-fit: cover; background: #f9f9f9; }
    
    .info { padding: 20px; flex-grow: 1; }
    .info h4 { margin: 0 0 10px 0; font-size: 1.2rem; color: #222; }
    .price { font-weight: bold; font-size: 1.4rem; color: #e67e22; margin-bottom: 10px; display: block; }
    .rating { color: #f1c40f; margin-bottom: 15px; font-size: 0.9rem; }
    
    /* Order Button Black Style */
    .buy-btn { background: #000; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .buy-btn:hover { background: #333; }

    #loading { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 1.2rem; }

    /* Mobile Responsive Fixes */
    @media (max-width: 768px) { 
      .container { flex-direction: column; } 
      aside { width: 100%; }
      /* Mobile categories as horizontal scrollable list */
      #categories { flex-direction: row; overflow-x: auto; padding-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .cat-btn { width: auto; padding: 10px 20px; flex-shrink: 0; }
      .cat-btn:hover { transform: none; }
      
      main { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
      .card img { height: 180px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Yektha</h1>
  <input type="text" id="search" placeholder="Search for dresses, electronics..." class="search-bar">
</header>

<div class="container">
  <aside>
    <h3>Categories</h3>
    <div id="categories">
      <button class="cat-btn" onclick="filter('All')">All Products</button>
    </div>
  </aside>

  <main id="products-grid">
    <div id="loading">Loading products from Google Sheets...</div>
  </main>
</div>

<script>
  const SHEET_ID = '1HyGFrTu37DJ4u9mxx2vK0aBC5B_yqViRGESUEkV34aU'; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let allProducts = [];

  async function fetchProducts() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1];
      const data = JSON.parse(jsonText);
      const rows = data.table.rows;

      allProducts = rows.map(row => ({
        name: row.c[0] ? row.c[0].v : 'Unnamed Product',
        price: row.c[1] ? row.c[1].v : 'N/A',
        rating: row.c[2] ? row.c[2].v : '',
        category: row.c[3] ? row.c[3].v : 'General',
        photo: row.c[4] ? row.c[4].v : 'https://via.placeholder.com/250'
      }));

      displayProducts(allProducts);
      setupCategories();
    } catch (error) {
      console.error("Error fetching data:", error);
      document.getElementById('products-grid').innerHTML = `<div style="text-align:center; color:red; padding:20px; grid-column: 1/-1;"><h3>Error Loading Shop!</h3><p>Please make sure your Google Sheet is <b>'Published to Web'</b>.</p></div>`;
    }
  }

  function displayProducts(products) {
    const grid = document.getElementById('products-grid');
    if (products.length === 0) {
      grid.innerHTML = "<p>No products found matching your search.</p>";
      return;
    }
    
    grid.innerHTML = products.map(p => `
      <div class="card">
        <img src="${p.photo}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/250?text=Image+Not+Found'">
        <div class="info">
          <h4>${p.name}</h4>
          <span class="price">₹${p.price}</span>
          <div class="rating">${p.rating}</div>
          <small style="color: #888;">Category: ${p.category}</small>
        </div>
        <button class="buy-btn" onclick="order('${p.name}')">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.973L0 16l5.053-1.326A7.817 7.817 0 0 0 7.998 16c4.369 0 7.926-3.559 7.93-7.93a7.856 7.856 0 0 0-2.327-5.744zM7.997 14.67c-1.183 0-2.34-.317-3.344-.916l-.24-.144-2.487.652.665-2.417-.157-.251a6.588 6.588 0 0 1-1.008-3.465c.003-3.623 2.946-6.567 6.572-6.567a6.56 6.56 0 0 1 4.644 1.923 6.56 6.56 0 0 1 1.927 4.649c-.003 3.623-2.946 6.567-6.573 6.567z"/>
          </svg>
          ORDER ON WHATSAPP
        </button>
      </div>
    `).join('');
  }

  function setupCategories() {
    const categoriesDiv = document.getElementById('categories');
    const uniqueCats = ['All', ...new Set(allProducts.map(p => p.category))];
    
    categoriesDiv.innerHTML = uniqueCats.map(c => `
      <button class="cat-btn" onclick="filter('${c}')">${c}</button>
    `).join('');
  }

  function filter(cat) {
    const filtered = cat === 'All' ? allProducts : allProducts.filter(p => p.category === cat);
    displayProducts(filtered);
  }

  function order(name) {
    const wpNumber = "7594069256";
    const message = encodeURIComponent(`Hello Yektha! I am interested in buying: ${name}. Please let me know the details.`);
    window.open(`https://wa.me/${wpNumber}?text=${message}`, "_blank");
  }

  document.getElementById('search').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(val) || p.category.toLowerCase().includes(val));
    displayProducts(filtered);
  };

  fetchProducts();
</script>

</body>
</html>
